<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard Deviations</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1b2330;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
  <script>
    kaboom({
      width: 800,
      height: 600,
      background: [27, 35, 48],
      global: true,
      crisp: true,
    })

    const BALANCE = {
      assets: {
        characterSheetUrl: "https://github.com/user-attachments/assets/607c5542-10bd-419f-a71c-592401f64de7",
      },
      game: {
        width: 800,
        height: 600,
        baseMaxHp: 100,
        baseSize: 62,
        mapEdgePadding: 20,
        pathWidth: 64,
        pathPlacementBuffer: 14,
        minEnemySpeed: 20,
        pathEndThreshold: 1,
      },
      economy: {
        startMoney: 150,
        towerCost: 50,
      },
      wave: {
        difficultyMultiplier: 1.2,
        baseCount: 10,
        baseEnemyHp: 30,
        spawnGapBase: 0.75,
        spawnGapMin: 0.28,
        spawnGapWaveStep: 0.02,
        speedIncreasePerWave: 1.4,
        moneyBonusWaveDivisor: 2,
        expGrowthPerWave: 1.05,
      },
      combat: {
        baseDamageToCasino: 10,
        blindConfusionDuration: 1.5,
        critMultiplier: 1.5,
        critChance: 0.12,
        missChance: 0.05,
        defenseScaleFactor: 0.75,
      },
      progression: {
        startLevel: 1,
        startExp: 0,
        expToNextBase: 90,
        expGrowth: 1.33,
        upgradeBaseHeal: 10,
        levelUpBonuses: {
          blindDamageBonus: 1,
          legDamageBonus: 4,
          deafSlowBonus: 0.02,
          baseHeal: 3,
          towerHeal: 10,
          towerMpRestoreRatio: 0.4,
        },
      },
      visual: {
        legDropSpeed: 2400,
        legDropHeight: 320,
        legWidth: 42,
        legHeight: 230,
        legFadeRate: 4.2,
        shockwaveInitialRadius: 24,
        shockwaveExpandRate: 430,
        shockwaveFadeRate: 2.5,
        deafPulseBaseRadius: 6,
        deafPulseExpandRate: 250,
        deafPulseFadeRate: 1.8,
        floatingLife: 0.65,
        floatingRiseSpeed: 42,
        floatingFadeSpeed: 1.6,
        defaultIdleFrameSeconds: 0.25,
        enemyIdleFrameSeconds: 0.22,
        statBarWidth: 34,
        statBarHeight: 4,
        statBarYOffset: -34,
      },
    }

    // Sprite sheet provided by user.
    loadSprite("characterSheet", BALANCE.assets.characterSheetUrl, {
      sliceX: 8,
      sliceY: 3,
    })

    // Character data is centralized and frame-mapped by class (hero/enemy).
    const CHARACTER_CONFIG = {
      hero: {
        blind: {
          name: "The Blind",
          frame: 16,
          className: "hero",
          range: 165,
          fireRate: 0.45,
          abilityCost: 18,
          mpRegen: 18,
          stats: { maxHp: 95, maxMp: 100, attack: 12, defense: 2, exp: 0, level: 1 },
        },
        legless: {
          name: "The Legless",
          frame: 17,
          className: "hero",
          range: 210,
          fireRate: 3.0,
          abilityCost: 45,
          mpRegen: 12,
          aoeRadius: 110,
          stats: { maxHp: 115, maxMp: 90, attack: 70, defense: 3, exp: 0, level: 1 },
        },
        deaf: {
          name: "The Deaf",
          frame: 18,
          className: "hero",
          range: 135,
          fireRate: 0.18,
          abilityCost: 8,
          mpRegen: 24,
          stats: { maxHp: 90, maxMp: 120, attack: 0, defense: 1, exp: 0, level: 1 },
        },
      },
      enemy: {
        grunt: {
          name: "Bureaucrat Grunt",
          frame: 8,
          animFrames: [8, 9],
          className: "enemy",
          speed: 66,
          rewardMoney: 10,
          rewardExp: 18,
          stats: { maxHp: 30, maxMp: 0, attack: 9, defense: 0, exp: 0, level: 1 },
        },
        rogue: {
          name: "Bureaucrat Rogue",
          frame: 10,
          animFrames: [10, 11],
          className: "enemy",
          speed: 82,
          rewardMoney: 12,
          rewardExp: 22,
          stats: { maxHp: 25, maxMp: 0, attack: 10, defense: 0, exp: 0, level: 1 },
        },
        tank: {
          name: "Bureaucrat Tank",
          frame: 12,
          animFrames: [12, 13],
          className: "enemy",
          speed: 52,
          rewardMoney: 16,
          rewardExp: 28,
          stats: { maxHp: 45, maxMp: 0, attack: 13, defense: 2, exp: 0, level: 1 },
        },
      },
    }

    const HERO_PASSIVES = {
      blind: {
        title: "Sightless Commander",
        desc: "+3 Blind damage bonus",
        apply: (state) => { state.upgrades.blindDamageBonus += 3 },
      },
      legless: {
        title: "Crushing Commander",
        desc: "+18 Legless damage bonus",
        apply: (state) => { state.upgrades.legDamageBonus += 18 },
      },
      deaf: {
        title: "Echo Commander",
        desc: "+0.08 Deaf slow bonus",
        apply: (state) => { state.upgrades.deafSlowBonus += 0.08 },
      },
    }

    const UPGRADE_POOL = [
      {
        title: "Greased Palms",
        desc: "+75 Bribes immediately.",
        apply: (s) => { s.money += 75 },
      },
      {
        title: "Sketchy Eyedrops",
        desc: "The Blind deals +4 damage.",
        apply: (s) => { s.upgrades.blindDamageBonus += 4 },
      },
      {
        title: "Unlicensed Acoustics",
        desc: "The Deaf slows 10% harder.",
        apply: (s) => { s.upgrades.deafSlowBonus += 0.1 },
      },
      {
        title: "Counterfeit Prosthetics",
        desc: "The Legless slam deals +25 damage.",
        apply: (s) => { s.upgrades.legDamageBonus += 25 },
      },
      {
        title: "Backroom Insurance",
        desc: `Base heals +${BALANCE.progression.upgradeBaseHeal} HP (up to max).`,
        apply: (s) => { s.baseHp = Math.min(BALANCE.game.baseMaxHp, s.baseHp + BALANCE.progression.upgradeBaseHeal) },
      },
    ]

    const WAYPOINTS = [
      vec2(40, 90),
      vec2(250, 90),
      vec2(250, 220),
      vec2(580, 220),
      vec2(580, 360),
      vec2(180, 360),
      vec2(180, 510),
      vec2(740, 510),
    ]

    const EPSILON = 0.0001
    const SEGMENT_START_T = 0

    function makeInitialState(selectedHero = "blind") {
      return {
        wave: 1,
        completedWave: 0,
        money: BALANCE.economy.startMoney,
        baseHp: BALANCE.game.baseMaxHp,
        selectedHero,
        heroPassiveApplied: false,
        upgrades: {
          blindDamageBonus: 0,
          legDamageBonus: 0,
          deafSlowBonus: 0,
        },
        player: {
          level: BALANCE.progression.startLevel,
          exp: BALANCE.progression.startExp,
          expToNext: BALANCE.progression.expToNextBase,
        },
      }
    }

    function lineDistToPoint(p, a, b) {
      const ab = b.sub(a)
      const ap = p.sub(a)
      const denom = ab.dot(ab)
      if (denom <= EPSILON) return p.dist(a)
      const t = Math.max(0, Math.min(1, ap.dot(ab) / denom))
      const proj = a.add(ab.scale(t))
      return p.dist(proj)
    }

    const SEGMENT_LENGTHS = []
    let TOTAL_PATH_LEN = 0
    for (let i = 0; i < WAYPOINTS.length - 1; i++) {
      const len = WAYPOINTS[i].dist(WAYPOINTS[i + 1])
      SEGMENT_LENGTHS.push(len)
      TOTAL_PATH_LEN += len
    }

    function pointOnPath(dist) {
      let remainingDist = Math.max(0, Math.min(TOTAL_PATH_LEN, dist))
      for (let i = 0; i < SEGMENT_LENGTHS.length; i++) {
        const seg = SEGMENT_LENGTHS[i]
        if (remainingDist <= seg) {
          const t = seg === 0 ? SEGMENT_START_T : remainingDist / seg
          return WAYPOINTS[i].lerp(WAYPOINTS[i + 1], t)
        }
        remainingDist -= seg
      }
      return WAYPOINTS[WAYPOINTS.length - 1]
    }

    function isOnPath(p) {
      for (let i = 0; i < WAYPOINTS.length - 1; i++) {
        if (lineDistToPoint(p, WAYPOINTS[i], WAYPOINTS[i + 1]) <= BALANCE.game.pathWidth * 0.5 + BALANCE.game.pathPlacementBuffer) {
          return true
        }
      }
      return false
    }

    function pickRandomUpgrades(count) {
      const list = [...UPGRADE_POOL]
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1))
        const tmp = list[i]
        list[i] = list[j]
        list[j] = tmp
      }
      return list.slice(0, count)
    }

    function drawPath() {
      for (let i = 0; i < WAYPOINTS.length - 1; i++) {
        const a = WAYPOINTS[i]
        const b = WAYPOINTS[i + 1]
        const d = b.sub(a)
        const len = d.len()
        const ang = d.angle()
        add([
          pos(a),
          rect(len, BALANCE.game.pathWidth),
          anchor("left"),
          rotate(ang),
          color(62, 72, 84),
          opacity(0.92),
          z(0),
        ])
        add([
          pos(a),
          rect(len, 6),
          anchor("left"),
          rotate(ang),
          color(112, 124, 136),
          opacity(0.35),
          z(1),
        ])
      }
    }

    function drawGloomyEnvironment() {
      // Dark ground base.
      add([
        pos(0, 0),
        rect(BALANCE.game.width, BALANCE.game.height),
        anchor("topleft"),
        color(20, 28, 36),
        z(-20),
      ])

      // Vertical gradient bands for depth.
      for (let i = 0; i < 8; i++) {
        add([
          pos(0, i * 76),
          rect(BALANCE.game.width, 76),
          anchor("topleft"),
          color(22 + i * 3, 30 + i * 3, 38 + i * 3),
          opacity(0.22),
          z(-19),
        ])
      }

      // Distant moon glow.
      add([pos(700, 86), circle(46), color(180, 200, 220), opacity(0.2), z(-18)])
      add([pos(700, 86), circle(20), color(215, 225, 235), opacity(0.42), z(-17)])

      // Ground fog layers.
      for (let i = 0; i < 7; i++) {
        add([
          pos(80 + i * 110, 525 + (i % 2) * 10),
          circle(90),
          color(88, 104, 120),
          opacity(0.12),
          z(-10),
        ])
      }

      // Dead-tree-like silhouettes.
      const trees = [
        vec2(82, 470),
        vec2(322, 470),
        vec2(630, 462),
        vec2(746, 440),
      ]
      trees.forEach((p) => {
        add([pos(p), rect(8, 58), color(38, 40, 46), z(-5)])
        add([pos(p.x - 12, p.y + 18), rect(24, 5), rotate(-28), color(38, 40, 46), z(-5)])
        add([pos(p.x + 2, p.y + 8), rect(20, 4), rotate(23), color(38, 40, 46), z(-5)])
      })

      // Scattered stones/debris.
      const stones = [
        vec2(110, 140), vec2(360, 120), vec2(695, 180), vec2(690, 430),
        vec2(305, 430), vec2(120, 330), vec2(510, 448), vec2(430, 302),
      ]
      stones.forEach((p, i) => {
        add([
          pos(p),
          rect(10 + (i % 3) * 4, 7 + (i % 2) * 3),
          color(70, 78, 88),
          opacity(0.65),
          z(-2),
        ])
      })
    }

    function makeStats(raw, scaleFactor = 1) {
      const maxHp = Math.max(1, Math.round(raw.maxHp * scaleFactor))
      const maxMp = Math.max(0, Math.round(raw.maxMp * scaleFactor))
      return {
        hp: maxHp,
        maxHp,
        mp: maxMp,
        maxMp,
        attack: Math.max(0, Math.round(raw.attack * scaleFactor)),
        defense: Math.max(0, Math.round(raw.defense * Math.max(1, scaleFactor * BALANCE.combat.defenseScaleFactor))),
        exp: raw.exp || 0,
        level: raw.level || 1,
      }
    }

    function getCharacterDefinition(role, type) {
      return CHARACTER_CONFIG[role][type]
    }

    function createCharacterEntity({ role, type, worldPos, scaleFactor = 1, tags = [] }) {
      const def = getCharacterDefinition(role, type)
      const ent = add([
        pos(worldPos),
        sprite("characterSheet", { frame: def.frame }),
        scale(1.1),
        anchor("center"),
        area(),
        z(role === "enemy" ? 6 : 8),
        "character",
        role,
        ...tags,
        {
          role,
          type,
          className: def.className,
          stats: makeStats(def.stats, scaleFactor),
        },
      ])
      return ent
    }

    function attachIdleAnimation(owner, frames, frameSeconds = BALANCE.visual.defaultIdleFrameSeconds) {
      if (!frames || frames.length === 0) return
      if (frames.length === 1) {
        owner.frame = frames[0]
        return
      }
      const idleFrames = frames.slice(0, 2)
      owner.animFrameTimer = 0
      owner.animFrameIndex = 0
      owner.frame = idleFrames[0]

      owner.onUpdate(() => {
        if (!owner.exists()) return
        owner.animFrameTimer += dt()
        if (owner.animFrameTimer < frameSeconds) return
        owner.animFrameTimer = 0
        owner.animFrameIndex = (owner.animFrameIndex + 1) % idleFrames.length
        owner.frame = idleFrames[owner.animFrameIndex]
      })
    }

    function attachStatBars(owner, showMp = true) {
      const barW = BALANCE.visual.statBarWidth
      const barH = BALANCE.visual.statBarHeight
      const yOffset = BALANCE.visual.statBarYOffset

      const hpBg = add([pos(owner.pos), rect(barW, barH), anchor("left"), color(18, 18, 18), opacity(0.8), z(30)])
      const hpFill = add([pos(owner.pos), rect(barW, barH), anchor("left"), color(235, 70, 85), z(31)])
      let mpBg = null
      let mpFill = null

      if (showMp) {
        mpBg = add([pos(owner.pos), rect(barW, barH), anchor("left"), color(18, 18, 18), opacity(0.8), z(30)])
        mpFill = add([pos(owner.pos), rect(barW, barH), anchor("left"), color(80, 170, 255), z(31)])
      }

      const destroyBars = () => {
        if (hpBg.exists()) destroy(hpBg)
        if (hpFill.exists()) destroy(hpFill)
        if (mpBg && mpBg.exists()) destroy(mpBg)
        if (mpFill && mpFill.exists()) destroy(mpFill)
      }

      hpFill.onUpdate(() => {
        if (!owner.exists()) {
          destroyBars()
          return
        }

        const hpRatio = Math.max(0, Math.min(1, owner.stats.hp / owner.stats.maxHp))
        hpBg.pos = vec2(owner.pos.x - barW / 2, owner.pos.y + yOffset)
        hpFill.pos = vec2(owner.pos.x - barW / 2, owner.pos.y + yOffset)
        hpFill.scale.x = hpRatio

        if (mpBg && mpFill) {
          const mpRatio = owner.stats.maxMp <= 0 ? 0 : Math.max(0, Math.min(1, owner.stats.mp / owner.stats.maxMp))
          mpBg.pos = vec2(owner.pos.x - barW / 2, owner.pos.y + yOffset + 6)
          mpFill.pos = vec2(owner.pos.x - barW / 2, owner.pos.y + yOffset + 6)
          mpFill.scale.x = mpRatio
        }
      })
    }

    function attachTowerVisualRig(owner, towerType) {
      const palette = {
        blind: [150, 150, 170],
        legless: [130, 185, 110],
        deaf: [95, 160, 235],
      }
      const [r, g, b] = palette[towerType] || [165, 165, 180]

      const base = add([
        pos(owner.pos),
        rect(36, 12),
        anchor("center"),
        color(56, 64, 78),
        outline(2, rgb(120, 135, 155)),
        z(7),
      ])
      const turret = add([
        pos(owner.pos),
        rect(16, 8),
        anchor("center"),
        color(r, g, b),
        outline(1, rgb(235, 235, 245)),
        z(10),
      ])

      turret.onUpdate(() => {
        if (!owner.exists()) {
          if (base.exists()) destroy(base)
          if (turret.exists()) destroy(turret)
          return
        }

        base.pos = vec2(owner.pos.x, owner.pos.y + 16)
        turret.pos = vec2(owner.pos.x + 10, owner.pos.y - 1)
      })
    }

    function spawnFloatingText(worldPos, msg, kind = "normal") {
      const palette = {
        normal: [255, 235, 110],
        crit: [255, 105, 105],
        miss: [190, 205, 225],
        level: [160, 255, 160],
      }

      const c = palette[kind] || palette.normal
      const floater = add([
        text(msg, { size: 16 }),
        pos(worldPos),
        anchor("center"),
        color(c[0], c[1], c[2]),
        z(40),
        opacity(1),
        {
          life: BALANCE.visual.floatingLife,
        },
      ])

      floater.onUpdate(() => {
        floater.life -= dt()
        floater.pos.y -= BALANCE.visual.floatingRiseSpeed * dt()
        floater.opacity -= BALANCE.visual.floatingFadeSpeed * dt()
        if (floater.life <= 0 || floater.opacity <= 0) destroy(floater)
      })
    }

    function applyDamage(source, target, rawDamage) {
      if (!target.exists()) return { killed: false, hit: false, crit: false, damage: 0 }

      if (Math.random() < BALANCE.combat.missChance) {
        spawnFloatingText(target.pos, "MISS", "miss")
        return { killed: false, hit: false, crit: false, damage: 0 }
      }

      let damage = Math.max(1, Math.round(rawDamage - target.stats.defense))
      let crit = false
      if (Math.random() < BALANCE.combat.critChance) {
        crit = true
        damage = Math.round(damage * BALANCE.combat.critMultiplier)
      }

      target.stats.hp = Math.max(0, target.stats.hp - damage)
      spawnFloatingText(target.pos, `-${damage}`, crit ? "crit" : "normal")

      return {
        killed: target.stats.hp <= 0,
        hit: true,
        crit,
        damage,
      }
    }

    function pickEnemyTypeForWave(wave) {
      // Precedence: milestone waves first, then mixed waves, then simple divisibility.
      if (wave % 15 === 0) return "tank"
      if (wave % 10 === 0) return "tank"
      if (wave % 6 === 0) return Math.random() < 0.5 ? "tank" : "rogue"
      if (wave % 5 === 0) return "tank"
      if (wave % 3 === 0) return "rogue"
      return "grunt"
    }

    scene("start", () => {
      add([
        text("STANDARD DEVIATIONS", { size: 42 }),
        pos(center().x, 190),
        anchor("center"),
        color(235, 235, 245),
      ])
      add([
        text("Defend the Illegal Underground Casino", { size: 20 }),
        pos(center().x, 245),
        anchor("center"),
        color(170, 190, 220),
      ])
      add([
        text("Sprite Characters + HP/MP/EXP + Wave HUD", { size: 16 }),
        pos(center().x, 280),
        anchor("center"),
        color(140, 230, 180),
      ])
      add([
        text("Press SPACE to Choose Hero", { size: 24 }),
        pos(center().x, 340),
        anchor("center"),
        color(255, 235, 120),
      ])
      onKeyPress("space", () => go("hero_select"))
    })

    scene("hero_select", () => {
      const heroKeys = ["blind", "legless", "deaf"]
      add([
        text("CHOOSE YOUR HERO (1 / 2 / 3)", { size: 32 }),
        pos(center().x, 90),
        anchor("center"),
        color(220, 245, 255),
      ])

      heroKeys.forEach((key, i) => {
        const def = getCharacterDefinition("hero", key)
        const passive = HERO_PASSIVES[key]
        const y = 185 + i * 125

        add([
          pos(84, y - 24),
          rect(632, 94),
          color(47, 58, 75),
          outline(3, rgb(95, 120, 155)),
        ])
        add([
          text(`${i + 1}. ${def.name}`, { size: 23 }),
          pos(106, y),
          color(235, 245, 255),
        ])
        add([
          text(`Passive: ${passive.title} (${passive.desc})`, { size: 16 }),
          pos(108, y + 34),
          color(175, 220, 255),
        ])
      })

      add([
        text("Press ESC to return", { size: 16 }),
        pos(20, 570),
        color(200, 210, 225),
      ])

      onKeyPress("1", () => go("game", makeInitialState("blind")))
      onKeyPress("2", () => go("game", makeInitialState("legless")))
      onKeyPress("3", () => go("game", makeInitialState("deaf")))
      onKeyPress("escape", () => go("start"))
    })

    scene("draft", (state) => {
      const options = pickRandomUpgrades(3)

      add([
        text(`Wave ${state.completedWave || Math.max(0, state.wave - 1)} Cleared`, { size: 36 }),
        pos(center().x, 90),
        anchor("center"),
        color(220, 245, 255),
      ])
      add([
        text("Draft an upgrade (Press 1 / 2 / 3)", { size: 20 }),
        pos(center().x, 130),
        anchor("center"),
        color(255, 220, 130),
      ])

      options.forEach((opt, i) => {
        const y = 210 + i * 120
        add([
          pos(90, y - 24),
          rect(620, 92),
          color(47, 58, 75),
          outline(3, rgb(95, 120, 155)),
        ])
        add([
          text(`${i + 1}. ${opt.title}`, { size: 24 }),
          pos(110, y),
          color(230, 240, 255),
        ])
        add([
          text(opt.desc, { size: 17 }),
          pos(112, y + 34),
          color(175, 195, 225),
        ])
      })

      function pick(idx) {
        if (!options[idx]) return
        options[idx].apply(state)
        go("game", state)
      }

      onKeyPress("1", () => pick(0))
      onKeyPress("2", () => pick(1))
      onKeyPress("3", () => pick(2))
    })

    scene("gameover", (data) => {
      add([
        text("CASINO BUSTED", { size: 54 }),
        pos(center().x, 210),
        anchor("center"),
        color(250, 110, 110),
      ])
      add([
        text(`You reached wave ${data.waveReached}`, { size: 28 }),
        pos(center().x, 290),
        anchor("center"),
        color(220, 235, 255),
      ])
      add([
        text(`Final Level ${data.levelReached}`, { size: 20 }),
        pos(center().x, 325),
        anchor("center"),
        color(170, 220, 255),
      ])
      add([
        text("Press SPACE to Restart", { size: 24 }),
        pos(center().x, 370),
        anchor("center"),
        color(255, 235, 125),
      ])
      onKeyPress("space", () => go("start"))
    })

    scene("game", (state) => {
      drawGloomyEnvironment()
      drawPath()

      const base = add([
        pos(WAYPOINTS[WAYPOINTS.length - 1]),
        rect(BALANCE.game.baseSize, BALANCE.game.baseSize),
        anchor("center"),
        color(150, 125, 60),
        outline(4, rgb(255, 220, 130)),
        z(3),
      ])

      add([
        text("CASINO", { size: 14 }),
        pos(base.pos.x, base.pos.y),
        anchor("center"),
        color(30, 20, 8),
        z(4),
      ])

      const ui = {
        money: add([text("", { size: 18 }), pos(16, 12), fixed(), z(100), color(245, 230, 130)]),
        hp: add([text("", { size: 18 }), pos(16, 36), fixed(), z(100), color(245, 165, 165)]),
        wave: add([text("", { size: 18 }), pos(16, 60), fixed(), z(100), color(185, 220, 255)]),
        level: add([text("", { size: 18 }), pos(16, 84), fixed(), z(100), color(175, 255, 170)]),
        hero: add([text("", { size: 18 }), pos(16, 108), fixed(), z(100), color(255, 215, 165)]),
        tower: add([text("", { size: 18 }), pos(16, 132), fixed(), z(100), color(200, 220, 245)]),
        hint: add([text("", { size: 16 }), pos(16, 560), fixed(), z(100), color(255, 240, 185)]),
        expLabel: add([text("EXP", { size: 14 }), pos(16, 536), fixed(), z(100), color(170, 220, 255)]),
        expBg: add([rect(300, 12), pos(56, 538), anchor("left"), fixed(), color(35, 45, 60), z(100)]),
        expFill: add([rect(300, 12), pos(56, 538), anchor("left"), fixed(), color(80, 170, 255), z(101)]),
      }

      const enemies = []
      const towers = []
      const towerOrder = ["blind", "legless", "deaf"]
      let selectedTowerIdx = 0
      let spawnTimer = 0

      const waveManager = {
        wave: state.wave,
        spawned: 0,
        clearing: false,
      }

      if (!state.heroPassiveApplied) {
        const passive = HERO_PASSIVES[state.selectedHero] || HERO_PASSIVES.blind
        passive.apply(state)
        state.heroPassiveApplied = true
      }

      const waveScale = Math.pow(BALANCE.wave.difficultyMultiplier, waveManager.wave - 1)
      waveManager.waveCount = Math.max(1, Math.round(BALANCE.wave.baseCount * waveScale))
      waveManager.spawnGap = Math.max(
        BALANCE.wave.spawnGapMin,
        BALANCE.wave.spawnGapBase - (waveManager.wave - 1) * BALANCE.wave.spawnGapWaveStep,
      )

      function gainPlayerExp(amount) {
        state.player.exp += amount
        while (state.player.exp >= state.player.expToNext) {
          state.player.exp -= state.player.expToNext
          state.player.level += 1
          state.player.expToNext = Math.round(state.player.expToNext * BALANCE.progression.expGrowth)

          state.upgrades.blindDamageBonus += BALANCE.progression.levelUpBonuses.blindDamageBonus
          state.upgrades.legDamageBonus += BALANCE.progression.levelUpBonuses.legDamageBonus
          state.upgrades.deafSlowBonus += BALANCE.progression.levelUpBonuses.deafSlowBonus
          state.baseHp = Math.min(BALANCE.game.baseMaxHp, state.baseHp + BALANCE.progression.levelUpBonuses.baseHeal)

          towers.forEach((t) => {
            if (!t.ent.exists()) return
            t.ent.stats.hp = Math.min(t.ent.stats.maxHp, t.ent.stats.hp + BALANCE.progression.levelUpBonuses.towerHeal)
            if (t.ent.stats.maxMp > 0) {
              t.ent.stats.mp = Math.min(
                t.ent.stats.maxMp,
                t.ent.stats.mp + Math.round(t.ent.stats.maxMp * BALANCE.progression.levelUpBonuses.towerMpRestoreRatio),
              )
            }
          })

          spawnFloatingText(vec2(400, 40), `LEVEL ${state.player.level}!`, "level")
        }
      }

      function canCastAbility(tower, def) {
        return tower.ent.exists() && tower.cooldown <= 0 && tower.ent.stats.mp >= def.abilityCost
      }

      function spawnEnemy() {
        const enemyType = pickEnemyTypeForWave(waveManager.wave)
        const def = getCharacterDefinition("enemy", enemyType)
        const enemyScale = Math.pow(BALANCE.wave.difficultyMultiplier, waveManager.wave - 1)
        const enemy = createCharacterEntity({
          role: "enemy",
          type: enemyType,
          worldPos: pointOnPath(0),
          scaleFactor: enemyScale,
          tags: ["enemy"],
        })

        enemy.baseSpeed = def.speed + waveManager.wave * BALANCE.wave.speedIncreasePerWave
        enemy.currentSpeed = enemy.baseSpeed
        enemy.pathDist = 0
        enemy.confusedUntil = 0
        enemy.rewardMoney = def.rewardMoney + Math.floor(waveManager.wave / BALANCE.wave.moneyBonusWaveDivisor)
        enemy.rewardExp = Math.round(def.rewardExp * Math.pow(BALANCE.wave.expGrowthPerWave, waveManager.wave - 1))

        attachIdleAnimation(enemy, def.animFrames, BALANCE.visual.enemyIdleFrameSeconds)
        attachStatBars(enemy, false)
        enemies.push(enemy)
      }

      function killEnemy(enemy) {
        if (!enemy.exists()) return
        const idx = enemies.indexOf(enemy)
        if (idx >= 0) enemies.splice(idx, 1)
        state.money += enemy.rewardMoney
        gainPlayerExp(enemy.rewardExp)
        destroy(enemy)
      }

      function removeEnemy(enemy) {
        if (!enemy.exists()) return
        const idx = enemies.indexOf(enemy)
        if (idx >= 0) enemies.splice(idx, 1)
        destroy(enemy)
      }

      function placeTower(worldPos) {
        if (
          worldPos.x < BALANCE.game.mapEdgePadding ||
          worldPos.x > BALANCE.game.width - BALANCE.game.mapEdgePadding ||
          worldPos.y < BALANCE.game.mapEdgePadding ||
          worldPos.y > BALANCE.game.height - BALANCE.game.mapEdgePadding
        ) {
          ui.hint.text = "Can't place outside map."
          return
        }
        if (worldPos.dist(base.pos) < BALANCE.game.baseSize) {
          ui.hint.text = "Too close to the casino."
          return
        }
        if (isOnPath(worldPos)) {
          ui.hint.text = "Towers can't be placed on the path."
          return
        }
        if (state.money < BALANCE.economy.towerCost) {
          ui.hint.text = "Not enough Bribes."
          return
        }

        const key = towerOrder[selectedTowerIdx]
        const def = getCharacterDefinition("hero", key)
        state.money -= BALANCE.economy.towerCost
        ui.hint.text = `${def.name} deployed.`

        const body = createCharacterEntity({
          role: "hero",
          type: key,
          worldPos,
          scaleFactor: 1,
          tags: ["tower"],
        })

        attachTowerVisualRig(body, key)
        attachStatBars(body, true)
        towers.push({
          type: key,
          ent: body,
          cooldown: 0,
        })
      }

      onMousePress((btn) => {
        if (btn !== "left") return
        placeTower(mousePos())
      })

      onKeyPress("1", () => { selectedTowerIdx = 0 })
      onKeyPress("2", () => { selectedTowerIdx = 1 })
      onKeyPress("3", () => { selectedTowerIdx = 2 })

      onUpdate(() => {
        spawnTimer += dt()
        if (waveManager.spawned < waveManager.waveCount && spawnTimer >= waveManager.spawnGap) {
          spawnTimer = 0
          waveManager.spawned += 1
          spawnEnemy()
        }

        enemies.forEach((e) => {
          if (!e.exists()) return
          e.currentSpeed = e.baseSpeed
        })

        // MP regen for hero units.
        towers.forEach((t) => {
          if (!t.ent.exists()) return
          const def = getCharacterDefinition("hero", t.type)
          if (t.ent.stats.maxMp > 0 && t.ent.stats.mp < t.ent.stats.maxMp) {
            t.ent.stats.mp = Math.min(t.ent.stats.maxMp, t.ent.stats.mp + def.mpRegen * dt())
          }
        })

        // Deaf aura slows enemies.
        towers.forEach((t) => {
          if (t.type !== "deaf" || !t.ent.exists()) return
          const d = getCharacterDefinition("hero", "deaf")
          const slowAmount = Math.min(0.85, 0.4 + state.upgrades.deafSlowBonus)
          enemies.forEach((e) => {
            if (!e.exists()) return
            if (e.pos.dist(t.ent.pos) <= d.range) {
              e.currentSpeed = Math.max(BALANCE.game.minEnemySpeed, e.currentSpeed * (1 - slowAmount))
            }
          })
        })

        enemies.forEach((enemy) => {
          if (!enemy.exists()) return
          const confused = time() < enemy.confusedUntil
          const speed = confused ? enemy.baseSpeed : enemy.currentSpeed
          enemy.pathDist += (confused ? -1 : 1) * speed * dt()
          enemy.pathDist = Math.max(0, enemy.pathDist)
          enemy.pos = pointOnPath(enemy.pathDist)

          if (enemy.pathDist >= TOTAL_PATH_LEN - BALANCE.game.pathEndThreshold) {
            removeEnemy(enemy)
            state.baseHp -= BALANCE.combat.baseDamageToCasino
            if (state.baseHp <= 0) {
              go("gameover", { waveReached: waveManager.wave, levelReached: state.player.level })
            }
          }
        })

        towers.forEach((tower) => {
          if (!tower.ent.exists()) return
          tower.cooldown -= dt()
          const pos0 = tower.ent.pos
          const def = getCharacterDefinition("hero", tower.type)

          if (tower.type === "blind") {
            if (!canCastAbility(tower, def)) return
            let best = null
            let bestDist = Infinity
            enemies.forEach((e) => {
              if (!e.exists()) return
              const d = e.pos.dist(pos0)
              if (d <= def.range && d < bestDist) {
                best = e
                bestDist = d
              }
            })
            if (!best) return

            tower.cooldown = def.fireRate
            tower.ent.stats.mp -= def.abilityCost

            const raw = tower.ent.stats.attack + state.upgrades.blindDamageBonus
            const result = applyDamage(tower.ent, best, raw)
            best.confusedUntil = Math.max(best.confusedUntil, time() + BALANCE.combat.blindConfusionDuration)

            const delta = best.pos.sub(pos0)
            add([
              pos(pos0),
              rect(delta.len(), 3),
              rotate(delta.angle()),
              anchor("left"),
              color(170, 170, 210),
              opacity(0.9),
              z(20),
              lifespan(0.08),
            ])

            if (result.killed) killEnemy(best)
          }

          if (tower.type === "legless") {
            if (!canCastAbility(tower, def)) return
            let target = null
            let progress = -1
            enemies.forEach((e) => {
              if (!e.exists()) return
              const d = e.pos.dist(pos0)
              if (d <= def.range && e.pathDist > progress) {
                progress = e.pathDist
                target = e
              }
            })
            if (!target) return

            tower.cooldown = def.fireRate
            tower.ent.stats.mp -= def.abilityCost

            const strikePos = vec2(target.pos.x, target.pos.y)
            const aoe = def.aoeRadius
            const dmg = tower.ent.stats.attack + state.upgrades.legDamageBonus

            const leg = add([
              pos(strikePos.x, strikePos.y - BALANCE.visual.legDropHeight),
              rect(BALANCE.visual.legWidth, BALANCE.visual.legHeight),
              anchor("center"),
              color(195, 220, 175),
              opacity(0.75),
              z(25),
              {
                hit: false,
                floorY: strikePos.y,
              },
            ])

            leg.onUpdate(() => {
              leg.pos.y += BALANCE.visual.legDropSpeed * dt()
              if (!leg.hit && leg.pos.y >= leg.floorY) {
                leg.hit = true
                leg.pos.y = leg.floorY

                const wave = add([
                  pos(strikePos),
                  circle(BALANCE.visual.shockwaveInitialRadius),
                  anchor("center"),
                  color(255, 255, 255),
                  opacity(0.7),
                  z(26),
                  { r: BALANCE.visual.shockwaveInitialRadius },
                ])

                wave.onUpdate(() => {
                  wave.r += BALANCE.visual.shockwaveExpandRate * dt()
                  wave.opacity -= BALANCE.visual.shockwaveFadeRate * dt()
                  wave.scale = vec2(
                    wave.r / BALANCE.visual.shockwaveInitialRadius,
                    wave.r / BALANCE.visual.shockwaveInitialRadius,
                  )
                  if (wave.opacity <= 0) destroy(wave)
                })

                enemies.slice().forEach((e) => {
                  if (!e.exists()) return
                  if (e.pos.dist(strikePos) <= aoe) {
                    const result = applyDamage(tower.ent, e, dmg)
                    if (result.killed) killEnemy(e)
                  }
                })
              }

              if (leg.hit) {
                leg.opacity -= BALANCE.visual.legFadeRate * dt()
                if (leg.opacity <= 0) destroy(leg)
              }
            })
          }

          if (tower.type === "deaf") {
            if (!canCastAbility(tower, def)) return
            tower.cooldown = def.fireRate
            tower.ent.stats.mp -= def.abilityCost

            const pulse = add([
              pos(pos0),
              circle(BALANCE.visual.deafPulseBaseRadius),
              anchor("center"),
              color(135, 190, 255),
              opacity(0.45),
              z(9),
              { r: BALANCE.visual.deafPulseBaseRadius },
            ])
            pulse.onUpdate(() => {
              pulse.r += BALANCE.visual.deafPulseExpandRate * dt()
              pulse.scale = vec2(
                pulse.r / BALANCE.visual.deafPulseBaseRadius,
                pulse.r / BALANCE.visual.deafPulseBaseRadius,
              )
              pulse.opacity -= BALANCE.visual.deafPulseFadeRate * dt()
              if (pulse.opacity <= 0) destroy(pulse)
            })
          }
        })

        if (!waveManager.clearing && waveManager.spawned >= waveManager.waveCount && enemies.length === 0) {
          waveManager.clearing = true
          state.completedWave = waveManager.wave
          state.wave = waveManager.wave + 1
          wait(0.5, () => go("draft", state))
        }

        const expRatio = Math.max(0, Math.min(1, state.player.exp / state.player.expToNext))
        ui.expFill.scale.x = expRatio
        ui.expLabel.text = `EXP ${Math.floor(state.player.exp)} / ${state.player.expToNext}`

        const selected = getCharacterDefinition("hero", towerOrder[selectedTowerIdx])
        const selectedHero = getCharacterDefinition("hero", state.selectedHero || "blind")
        ui.money.text = `Bribes: ${state.money}`
        ui.hp.text = `Casino HP: ${Math.max(0, state.baseHp)}`
        ui.wave.text = `Wave: ${waveManager.wave} (${waveManager.spawned}/${waveManager.waveCount})`
        ui.level.text = `Level: ${state.player.level}`
        ui.hero.text = `Hero: ${selectedHero.name}`
        ui.tower.text = `Selected: ${selected.name} [1/2/3] | Cost: ${BALANCE.economy.towerCost}`
        if (!ui.hint.text) ui.hint.text = "Click to place characters and defend the casino."
      })
    })

    onLoad(() => {
      go("start")
    })
  </script>
</body>
</html>
